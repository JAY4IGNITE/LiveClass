# nginx reverse proxy for LiveClass IDE: TLS termination + WebSocket upgrade.
# The backend trusts X-Forwarded-For ONLY from this proxy (configure the ASGI
# server's trusted hosts), so a client cannot spoof it to bypass per-IP limits.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name liveclass.local;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # WebSocket collaboration gateway.
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived sockets; heartbeats keep them alive
        proxy_send_timeout 3600s;
        proxy_buffering off;        # stream frames rather than buffering
    }

    # HTTP API.
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
