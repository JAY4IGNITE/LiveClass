[project]
name = "liveclass-protocol"
version = "0.0.0"
description = "LiveClass IDE wire protocol — JSON Schema source of truth + generated Pydantic models"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liveclass_protocol"]
