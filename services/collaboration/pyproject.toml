[project]
name = "liveclass-collab"
version = "0.0.0"
description = "LiveClass IDE WebSocket collaboration gateway + authoritative sequencer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "redis>=5.2",
  "structlog>=24.4",
  "pydantic>=2.10",
  "liveclass-api",
  "liveclass-protocol",
]

[tool.uv.sources]
liveclass-api = { workspace = true }
liveclass-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liveclass_collab"]
