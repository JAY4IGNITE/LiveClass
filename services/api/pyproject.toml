[project]
name = "liveclass-api"
version = "0.0.0"
description = "LiveClass IDE HTTP API + shared backend core (config, DB, auth, authz)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "structlog>=24.4",
  "redis>=5.2",
  "liveclass-protocol",
]

[tool.uv.sources]
liveclass-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liveclass_api"]
